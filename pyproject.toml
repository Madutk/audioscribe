[project]
name = "audioscribe"
version = "0.1.0"
description = "Lokale Audio-Transkription mit Sprecher-Diarisierung (WhisperX: faster-whisper large-v3 + wav2vec2-Alignment + pyannote). Vollstaendig lokal: CUDA, Apple Silicon (MPS/MLX) oder CPU."
readme = "README.md"
authors = [{ name = "Marek", email = "madutkow@googlemail.com" }]
# Python auf 3.12 gepinnt: maximale Kompatibilitaet des ML-Stacks (whisperx / pyannote.audio 3.1).
requires-python = ">=3.12,<3.13"

dependencies = [
    # --- Kern-Pipeline: WhisperX buendelt Transkription + wav2vec2-Alignment + pyannote-Diarization ---
    "whisperx>=3.3",
    # torch/torchaudio: NICHT hier, sondern ueber die Extras 'cpu'/'cu124' (s.u.) —
    # die Backend-Wahl (CPU-Wheels vs. CUDA-Wheels) faellt bei 'uv sync --extra ...'.
    # --- gebuendeltes ffmpeg-Binary: WhisperX dekodiert Audio per ffmpeg; so kein System-ffmpeg/sudo noetig ---
    "imageio-ffmpeg>=0.5",
    # --- optionale PDF-Erzeugung (FR-8); rein in Python, keine System-Libs ---
    "fpdf2>=2.7",
]

[project.optional-dependencies]
# --- Rechen-Backend: genau EINES der beiden Extras waehlen (PRD §14, FR-19) ---
#   uv sync --extra cu124   -> NVIDIA-GPU (CUDA-Wheels, wie bisher)
#   uv sync --extra cpu     -> Rechner ohne NVIDIA-Karte (schlanke CPU-Wheels)
# Deckel <2.7: der cu124-Index endet bei torch 2.6.x; gleicher Deckel fuer cpu
# haelt beide Lock-Varianten auf derselben torch-Version.
cpu = [
    "torch>=2.4,<2.7",
    "torchaudio>=2.4,<2.7",
]
cu124 = [
    "torch>=2.4,<2.7",
    "torchaudio>=2.4,<2.7",
]
# Optionale Browser-Oberflaechen: Review/Bild-Annotation (PRD §13, NFR-7) und die
# Stapelverarbeitung ganzer Ordner ('audioscribe ui'). Lokaler Webserver;
# der Kern-CLI (Transkription/Diarisierung) bleibt ohne diese Pakete lauffaehig.
# Installation: uv sync --extra cu124 --extra review (bzw. --extra cpu --extra review)
review = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
# KI-Analyse per Claude-Agent ('audioscribe analyze', PRD §16). Das Agent SDK steuert
# Claude Code und nutzt dessen Anmeldung - mit Claude-Abo ohne API-Key.
# Installation: uv sync --extra cu124 --extra review --extra agent
agent = [
    "claude-agent-sdk>=0.2.156",
]

# Live-Transkription ('audioscribe live', PRD §17): System-Audio + Mikrofon und
# Bildschirmabgriff. Windows (WASAPI-Loopback) und macOS (zusammen mit 'mac') -
# unter WSL/Linux bleibt nur das WAV-Replay.
# Installation: uv sync --extra cu124 --extra review --extra live
live = [
    "PyAudioWPatch>=0.2.12; sys_platform == 'win32'",
    "mss>=9",
    "numpy",
    "scipy",
    "pillow",
]

# macOS auf Apple Silicon (PRD §19): mlx-whisper als schnelles ASR-Backend (Metal),
# sounddevice (buendelt PortAudio) fuers Mikrofon, PyObjC-Bruecken fuer ScreenCaptureKit
# (System-Audio), Quartz (Fenster, Berechtigungen) und AVFoundation (Mikrofon-Freigabe).
# Alle Pakete tragen Plattform-Marker: unter Linux/Windows bleibt das Extra wirkungslos.
# torch kommt weiter aus 'cpu' - das arm64-Wheel enthaelt MPS.
# Installation: uv sync --extra cpu --extra mac --extra review --extra agent --extra live
mac = [
    "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sounddevice>=0.5; sys_platform == 'darwin'",
    "pyobjc-core>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-ScreenCaptureKit>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-CoreMedia>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-AVFoundation>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-libdispatch>=10.3; sys_platform == 'darwin'",
]

[project.scripts]
audioscribe = "audioscribe.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audioscribe"]

# --- PyTorch-Backend-Wahl: Index haengt am gewaehlten Extra (offizielles uv-Muster) ---
# 'cpu' und 'cu124' schliessen sich aus; uv bricht bei gleichzeitiger Wahl mit Fehler ab.
[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu124" },
    ],
    # CUDA-Wheels gibt es nicht fuer macOS; die Kombination ist immer ein Irrtum.
    [
        { extra = "mac" },
        { extra = "cu124" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu124", extra = "cu124" },
]
torchaudio = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu124", extra = "cu124" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# cu124 = PRD-Baseline; neuere Treiber sind abwaertskompatibel.
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
