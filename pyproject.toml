[project]
name = "audioscribe"
version = "0.1.0"
description = "Lokale Audio-Transkription mit Sprecher-Diarisierung (WhisperX: faster-whisper large-v3 + wav2vec2-Alignment + pyannote). Vollstaendig lokal, WSL2/CUDA."
readme = "README.md"
authors = [{ name = "Marek", email = "madutkow@googlemail.com" }]
# Python auf 3.12 gepinnt: maximale Kompatibilitaet des ML-Stacks (whisperx / pyannote.audio 3.1).
requires-python = ">=3.12,<3.13"

dependencies = [
    # --- Kern-Pipeline: WhisperX buendelt Transkription + wav2vec2-Alignment + pyannote-Diarization ---
    "whisperx>=3.3",
    # --- CUDA-PyTorch (ueber dedizierten Index, s. [tool.uv.sources]) ---
    "torch>=2.4",
    "torchaudio>=2.4",
    # --- gebuendeltes ffmpeg-Binary: WhisperX dekodiert Audio per ffmpeg; so kein System-ffmpeg/sudo noetig ---
    "imageio-ffmpeg>=0.5",
    # --- optionale PDF-Erzeugung (FR-8); rein in Python, keine System-Libs ---
    "fpdf2>=2.7",
]

[project.scripts]
audioscribe = "audioscribe.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audioscribe"]

# --- CUDA-PyTorch ueber dedizierten Index (cu124, PRD-Baseline; neuere Treiber sind abwaertskompatibel) ---
[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
